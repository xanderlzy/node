.phead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.phead .ntitle{padding:0}
.picon{border:0;background:var(--panel);border-radius:16px;width:54px;height:54px;font-size:30px;cursor:pointer;display:grid;place-items:center;color:var(--mute);flex:none;transition:transform .4s var(--spring)}
.picon:hover{transform:scale(1.08)}
.banner{background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blocks{margin-top:6px;padding-left:26px}
.blk{position:relative;display:flex;align-items:flex-start;padding-top:1px;padding-bottom:1px}
.grip{position:absolute;left:-24px;top:4px;border:0;background:none;color:var(--mute);width:22px;height:24px;cursor:grab;opacity:0;font-size:12px;letter-spacing:-2px;padding:0}
.blk:hover .grip,.grip:focus-visible{opacity:1}
@media(hover:none){.grip{opacity:.35}}
.bb{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0}
.bt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;text-transform:none;font-size:16px;line-height:1.6;padding:2px 0}
.bt:empty::before{content:attr(data-ph);color:var(--mute);opacity:0;pointer-events:none}
.blk:focus-within .bt:empty::before{opacity:.6}
.t-h1 .bt{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-top:14px}
.t-h2 .bt{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:10px}
.t-h3 .bt{font-size:19px;font-weight:600;margin-top:6px}
.t-quote .bb{border-left:3px solid var(--fg);padding-left:12px}
.t-callout .bb{background:var(--panel);border-radius:14px;padding:10px 12px;align-items:center}
.t-code .bt{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border-radius:12px;padding:12px 14px}
.bt code{font:.9em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border-radius:6px;padding:1px 5px}
.bt a{text-decoration:underline;text-underline-offset:2px}
.mk{flex:none;min-width:18px;text-align:center;color:var(--mute);line-height:1.6;padding-top:2px}
.tg{border:0;background:none;color:var(--mute);width:20px;height:26px;cursor:pointer;transition:transform .3s var(--spring);font-size:11px;padding:0;flex:none}
.tg.open{transform:rotate(90deg)}
.blk .ck{margin-top:5px}
.blk.d .bt{color:var(--mute);text-decoration:line-through}
.blk.d .ck{background:var(--fg);border-color:var(--fg)}
.blk.d .ck svg{transform:scale(1)}
.blk hr{border:0;border-top:1.5px solid var(--line);width:100%;margin:12px 0}
.blk.dt::before,.blk.db::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--fg);border-radius:2px}
.blk.dt::before{top:-1px}
.blk.db::after{bottom:-1px}
.blk.dragging{opacity:.35}
.addb{min-height:56px;cursor:text}
.smenu,.pop,.itb{position:fixed;z-index:300;background:var(--card);border-radius:16px;box-shadow:var(--lift);padding:6px}
.smenu[hidden],.itb[hidden]{display:none}
.smenu{width:220px;max-height:260px;overflow:auto}
.smenu .po.on{background:var(--panel)}
.itb{display:flex;gap:2px;padding:4px;border-radius:12px}
.itb button{border:0;background:none;color:var(--fg);padding:6px 9px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.itb button:hover{background:var(--panel)}
.pop{min-width:190px;max-height:70vh;overflow:auto}
.pop .nsec{padding-top:8px}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;width:228px}
.emo button{border:0;background:none;font-size:22px;padding:6px;border-radius:10px;cursor:pointer}
.emo button:hover{background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:400;font-size:14px;display:flex;gap:14px;align-items:center;animation:pop .5s var(--spring);transition:opacity .4s}
.toast.out{opacity:0}
.toast button{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px;animation:pop .6s var(--spring)}
.add{display:flex;margin-top:10px}
.add input{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--fg);border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;text-transform:none;outline:none;transition:.4s var(--spring)}
.add input::placeholder{color:var(--mute)}
.add input:focus{border-style:solid;border-color:var(--fg);background:var(--card);transform:scale(1.02);box-shadow:var(--shadow)}
.dot{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--fg);pointer-events:none;z-index:99}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" src="icon.svg" alt="node">
  <nav><span class="on" data-t="kanban">kanban</span><span data-t="notes">notes</span><span>timer<small>soon</small></span><span>habits<small>soon</small></span></nav><button class="set" title="settings" aria-label="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h8M16 8h4M4 16h4M12 16h8"/><circle cx="14" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg></button></div>
  <div id="v-kanban">
  <h1>kanban.</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="bar"></i></div>
  <div class="board" id="board"></div></div>
  <div id="v-notes" hidden></div>
  <footer class="foot"><a href="privacy.html">privacy</a> · <a href="terms.html">terms</a></footer>
</div>
<script src="notes.js"></script>
<script>
var COLS=[
 {k:"todo",n:"to do",g:"○",e:"nothing here. suspiciously calm."},
 {k:"doing",n:"in progress",g:"◐",e:"drag something in. get moving."},
 {k:"done",n:"done",g:"●",e:"finished things land here."}];
var S={todo:[],doing:[],done:[]},KEY="kanban-v1",drag=null,board;
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.todo&&d.doing&&d.done){S=d;return}}}catch(e){}
 S={todo:[],doing:[],done:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.nodePush)window.nodePush()}
function find(id){for(var i=0;i<COLS.length;i++){var k=COLS[i].k,j=S[k].findIndex(function(c){return c.id===id});if(j>-1)return{k:k,j:j}}}
function move(id,to,idx){
 var f=find(id);if(!f)return;var c=S[f.k].splice(f.j,1)[0];
 if(idx==null)idx=S[to].length;
 S[to].splice(idx,0,c);save();render(id);
 if(to==="done"&&f.k!=="done")confetti(id);
}
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function confetti(id){
 var el=document.querySelector('[data-id="'+id+'"]');if(!el)return;
 var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;buzz([10,40,10]);
 for(var i=0;i<16;i++){
  var d=document.createElement("div");d.className="dot";
  var s=4+Math.random()*6;d.style.width=d.style.height=s+"px";
  d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);
  var a=Math.PI*2*i/16+Math.random()*.4,dist=50+Math.random()*80;
  var an=d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*dist+"px,"+(Math.sin(a)*dist-20)+"px) scale(0)",opacity:0}],{duration:700+Math.random()*300,easing:"cubic-bezier(.2,.8,.2,1)"});
  an.onfinish=(function(n){return function(){n.remove()}})(d);
 }
}

/* pointer-based drag: mouse drags instantly, touch needs a short press so scrolling still works */
function colAt(x){var cols=document.querySelectorAll(".col");for(var i=0;i<cols.length;i++){var r=cols[i].getBoundingClientRect();if(x>=r.left&&x<=r.right)return cols[i]}return null}
function startDrag(){
 var d=drag;d.active=true;buzz(12);
 var r=d.el.getBoundingClientRect();d.ox=d.cx-r.left;d.oy=d.cy-r.top;
 var g=d.el.cloneNode(true);g.classList.add("ghost");g.classList.remove("dragging","pop");g.style.width=r.width+"px";d.ghost=g;document.body.appendChild(g);
 d.el.classList.add("dragging");document.body.classList.add("dragging");place();tick();
}
function place(){var d=drag;d.ghost.style.transform="translate("+(d.cx-d.ox)+"px,"+(d.cy-d.oy)+"px) rotate(3deg) scale(1.04)";
 var c=colAt(d.cx);if(c!==d.over){if(d.over)d.over.classList.remove("over");if(c){c.classList.add("over");buzz(6)}d.over=c}}
function tick(){
 var d=drag;if(!d||!d.active)return;
 var r=board.getBoundingClientRect(),z=Math.max(80,r.width*.22),f=0;
 if(d.cx<r.left+z)f=-Math.min(1,(r.left+z-d.cx)/z);else if(d.cx>r.right-z)f=Math.min(1,(d.cx-(r.right-z))/z);
 if(f)board.scrollLeft+=(f<0?-1:1)*(5+Math.abs(f)*22);
 place();d.raf=requestAnimationFrame(tick);
}
function onMove(e){
 var d=drag;if(!d||e.pointerId!==d.pid)return;d.cx=e.clientX;d.cy=e.clientY;
 if(!d.active){
  if(Math.hypot(d.cx-d.sx,d.cy-d.sy)>8){if(d.type==="mouse")startDrag();else endDrag(false)}
  return;
 }
 place();
}
function onUp(e){var d=drag;if(!d||e.pointerId!==d.pid)return;endDrag(e.type==="pointerup")}
function endDrag(drop){
 var d=drag;if(!d)return;drag=null;
 clearTimeout(d.timer);cancelAnimationFrame(d.raf);
 document.removeEventListener("pointermove",onMove);document.removeEventListener("pointerup",onUp);document.removeEventListener("pointercancel",onUp);
 if(!d.active)return;
 if(d.ghost)d.ghost.remove();
 document.body.classList.remove("dragging");d.el.classList.remove("dragging");
 document.querySelectorAll(".col").forEach(function(c){c.classList.remove("over")});
 if(drop&&d.over){
  var cards=[].slice.call(d.over.querySelectorAll(".card")).filter(function(x){return x.dataset.id!==d.id});
  var idx=0;cards.forEach(function(x){var r=x.getBoundingClientRect();if(d.cy>r.top+r.height/2)idx++});
  var k=COLS[[].indexOf.call(document.querySelectorAll(".col"),d.over)].k;
  move(d.id,k,idx);var cr=d.over.getBoundingClientRect(),br=board.getBoundingClientRect();board.scrollBy({left:(cr.left+cr.width/2)-(br.left+br.width/2),behavior:"smooth"});
 }
}
window.addEventListener("touchmove",function(e){if(drag&&drag.active)e.preventDefault()},{passive:false});

function startEdit(t,el,c){
 t.contentEditable="true";t.focus();
 var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r);
}
function mk(c,col,ci){
 c.sub=c.sub||[];
 var el=document.createElement("div");el.className="card"+(col.k==="done"?" done":"");el.dataset.id=c.id;
 var t=document.createElement("div");t.className="t";t.textContent=c.t;
 function editable(node,get,set){
  node.ondblclick=function(){startEdit(node)};
  node.onblur=function(){if(node.contentEditable!=="true")return;node.contentEditable="false";var v=node.textContent.trim();if(v)set(v);node.textContent=get()};
  node.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();node.blur()}};
 }
 editable(t,function(){return c.t},function(v){c.t=v;save()});
 /* checklist rows */
 var subs=document.createElement("div");subs.className="subs";
 var prog=document.createElement("div");prog.className="prog";
 var track=document.createElement("div");track.className="track";var fill=document.createElement("i");track.appendChild(fill);
 var cnt=document.createElement("span");prog.append(track,cnt);
 var rows=document.createElement("div");var addbox=document.createElement("div");
 subs.append(prog,rows,addbox);
 function stats(){
  var n=c.sub.length,d=c.sub.filter(function(s){return s.d}).length;
  prog.style.display=n?"flex":"none";subs.classList.toggle("has",n>0);
  fill.style.width=(n?d/n*100:0)+"%";cnt.textContent=d+"/"+n;
 }
 function paint(newId){
  rows.innerHTML="";
  c.sub.forEach(function(s){
   var r=document.createElement("div");r.className="sub"+(s.d?" d":"")+(s.id===newId?" pop":"");
   var ck=document.createElement("button");ck.className="ck";ck.setAttribute("aria-label","toggle row");
   ck.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
   ck.onclick=function(){s.d=!s.d;r.classList.toggle("d",s.d);save();stats();if(s.d)buzz(8)};
   var st=document.createElement("div");st.className="st";st.textContent=s.t;
   editable(st,function(){return s.t},function(v){s.t=v;save()});
   var sx=document.createElement("button");sx.className="sx";sx.textContent="×";sx.setAttribute("aria-label","delete row");
   sx.onclick=function(){r.classList.add("out");setTimeout(function(){var i=c.sub.indexOf(s);if(i>-1)c.sub.splice(i,1);save();paint();stats()},220)};
   r.append(ck,st,sx);rows.appendChild(r);
  });
  stats();
 }
 function openAdd(){
  var ex=addbox.querySelector("input");if(ex){ex.focus();return}
  var inp=document.createElement("input");inp.className="subin";inp.placeholder="add a row...";inp.autocomplete="off";inp.setAttribute("enterkeyhint","done");
  function add(){var v=inp.value.trim();if(!v)return;var s={id:uid(),t:v,d:false};c.sub.push(s);inp.value="";save();paint(s.id)}
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();add()}else if(e.key==="Escape"){inp.value="";inp.blur()}};
  inp.onblur=function(){add();inp.remove();subs.classList.remove("adding")};
  subs.classList.add("adding");addbox.appendChild(inp);inp.focus();
 }
 /* controls */
 var row=document.createElement("div");row.className="row";
 function b(txt,label,fn,cls){var x=document.createElement("button");x.textContent=txt;x.title=label;x.setAttribute("aria-label",label);if(cls)x.className=cls;x.onclick=fn;row.appendChild(x)}
 if(ci>0)b("←","move left",function(){move(c.id,COLS[ci-1].k)});
 if(ci<2)b("→","move right",function(){move(c.id,COLS[ci+1].k)});
 b("+","add a row",openAdd);
 b("✎","edit",function(){startEdit(t)});
 b("×","delete",function(){el.classList.add("out");setTimeout(function(){var f=find(c.id);if(f){S[f.k].splice(f.j,1);save();render()}},280)},"x");
 paint();
 el.append(t,subs,row);
 el.oncontextmenu=function(e){e.preventDefault()};
 el.onpointerdown=function(e){
  if(drag||e.button>0||e.target.closest("button,input")||e.target.isContentEditable)return;
  drag={id:c.id,el:el,pid:e.pointerId,type:e.pointerType,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,active:false};
  if(e.pointerType!=="mouse")drag.timer=setTimeout(function(){if(drag&&!drag.active)startDrag()},240);
  document.addEventListener("pointermove",onMove);document.addEventListener("pointerup",onUp);document.addEventListener("pointercancel",onUp);
 };
 return el;
}
function render(popId){
 COLS.forEach(function(col,ci){
  var list=document.getElementById("l-"+col.k);list.innerHTML="";
  S[col.k].forEach(function(c){var el=mk(c,col,ci);if(c.id===popId)el.classList.add("pop");list.appendChild(el)});
  if(!S[col.k].length){var e=document.createElement("div");e.className="empty";e.textContent=col.e;list.appendChild(e)}
  document.getElementById("n-"+col.k).textContent=S[col.k].length;
 });
 var tot=S.todo.length+S.doing.length+S.done.length;
 document.getElementById("bar").style.width=(tot?S.done.length/tot*100:0)+"%";
 document.getElementById("sub").textContent=tot?(S.done.length===tot?"all done. go touch some grass.":S.done.length+" of "+tot+" done. keep going."):"a blank slate. add something below.";
}
function init(){
 load();board=document.getElementById("board");
 COLS.forEach(function(col){
  var c=document.createElement("section");c.className="col";
  c.innerHTML='<div class="head"><span class="glyph">'+col.g+'</span>'+col.n+'<span class="count" id="n-'+col.k+'">0</span></div><div class="list" id="l-'+col.k+'"></div><div class="add"><input placeholder="add a task..." autocomplete="off" enterkeyhint="done" aria-label="add to '+col.n+'"></div>';
  var inp=c.querySelector("input");
  inp.onkeydown=function(e){if(e.key==="Enter"){var v=inp.value.trim();if(!v)return;var n={id:uid(),t:v};S[col.k].push(n);inp.value="";save();render(n.id)}};
  board.appendChild(c);
 });
 render();
 if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
}
var TOOL="kanban";try{TOOL=localStorage.getItem("node-tool")||"kanban"}catch(e){}
function setTool(t){
 TOOL=t;try{localStorage.setItem("node-tool",t)}catch(e){}
 document.getElementById("v-kanban").hidden=t!=="kanban";document.getElementById("v-notes").hidden=t!=="notes";
 document.querySelectorAll("nav span[data-t]").forEach(function(s){s.classList.toggle("on",s.dataset.t===t)});
 if(t==="notes")rn();window.scrollTo(0,0);
}
document.querySelectorAll("nav span[data-t]").forEach(function(s){s.onclick=function(){setTool(s.dataset.t)}});
/* sync hooks used by auth.js */
window.nodeUid=null;window.nodeEmail=null;
try{window.nodeUid=localStorage.getItem("node-uid");window.nodeEmail=localStorage.getItem("node-email")}catch(e){}
window.nodeGet=function(){return JSON.parse(JSON.stringify({todo:S.todo,doing:S.doing,done:S.done,favs:F}))};
window.nodeApply=function(d){S={todo:d.todo||[],doing:d.doing||[],done:d.done||[]};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();if(d.favs&&window.notesFavs)window.notesFavs(d.favs)};
window.nodeWipe=function(){S={todo:[],doing:[],done:[]};try{localStorage.removeItem(KEY)}catch(e){}render();if(window.notesWipe)window.notesWipe()};
init();
setTool(TOOL);
</script>
<script type="module" src="auth.js"></script>
</body>
