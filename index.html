<script>

 {k:"todo",n:"to do",g:"○",e:"nothing here. suspiciously calm."},
 {k:"doing",n:"in progress",g:"◐",e:"drag something in. get moving."},

function move(id,to,idx){
 var f=find(id);if(!f)return;var c=S[f.k].splice(f.j,1)[0];
 if(idx==null)idx=S[to].length;

 if(to==="done"&&f.k!=="done")confetti(id);
}

 var el=document.querySelector('[data-id="'+id+'"]');if(!el)return;
 var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;buzz([10,40,10]);
 for(var i=0;i<16;i++){
  var d=document.createElement("div");d.className="dot";
  var s=4+Math.random()*6;d.style.width=d.style.height=s+"px";

function colAt(x){var cols=document.querySelectorAll(".col");for(var i=0;i<cols.length;i++){var r=cols[i].getBoundingClientRect();if(x>=r.left&&x<=r.right)return cols[i]}return null}

 var r=d.el.getBoundingClientRect();d.ox=d.cx-r.left;d.oy=d.cy-r.top;
 var g=d.el.cloneNode(true);g.classList.add("ghost");g.classList.remove("dragging","pop");g.style.width=r.width+"px";d.ghost=g;document.body.appendChild(g);
 d.el.classList.add("dragging");document.body.classList.add("dragging");place();tick();
}
function place(){var d=drag;d.ghost.style.transform="translate("+(d.cx-d.ox)+"px,"+(d.cy-d.oy)+"px) rotate(3deg) scale(1.04)";
 var c=colAt(d.cx);if(c!==d.over){if(d.over)d.over.classList.remove("over");if(c){c.classList.add("over");buzz(6)}d.over=c}}
function tick(){
 var d=drag;if(!d||!d.active)return;
 var r=board.getBoundingClientRect(),z=Math.max(80,r.width*.22),f=0;
 if(d.cx<r.left+z)f=-Math.min(1,(r.left+z-d.cx)/z);else if(d.cx>r.right-z)f=Math.min(1,(d.cx-(r.right-z))/z);
 if(f)board.scrollLeft+=(f<0?-1:1)*(5+Math.abs(f)*22);
 place();d.raf=requestAnimationFrame(tick);
}
function onMove(e){
 var d=drag;if(!d||e.pointerId!==d.pid)return;d.cx=e.clientX;d.cy=e.clientY;

  if(Math.hypot(d.cx-d.sx,d.cy-d.sy)>8){if(d.type==="mouse")startDrag();else endDrag(false)}
  return;
 }

}
function onUp(e){var d=drag;if(!d||e.pointerId!==d.pid)return;endDrag(e.type==="pointerup")}
function endDrag(drop){

 if(drop&&d.over){
  var cards=[].slice.call(d.over.querySelectorAll(".card")).filter(function(x){return x.dataset.id!==d.id});
  var idx=0;cards.forEach(function(x){var r=x.getBoundingClientRect();if(d.cy>r.top+r.height/2)idx++});
  var k=COLS[[].indexOf.call(document.querySelectorAll(".col"),d.over)].k;

}
